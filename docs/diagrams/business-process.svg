<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#34443e" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="250" y="30" width="700" height="140" rx="8" fill="#f6f8f6" stroke="#34443e" stroke-width="2"/><path d="M250 82H950" stroke="#34443e"/><text x="266" y="65" font-family="Arial" font-size="26" fill="#172823" text-anchor="start" font-weight="700">Автор зберігає матеріал</text><text x="266" y="112" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">CSRF, роль Author, власник, поля, рубрика, теги</text><text x="266" y="147" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">ClientRequestId: повтор повертає наявний запис</text><rect x="250" y="270" width="700" height="140" rx="8" fill="#f6f8f6" stroke="#34443e" stroke-width="2"/><path d="M250 322H950" stroke="#34443e"/><text x="266" y="305" font-family="Arial" font-size="26" fill="#172823" text-anchor="start" font-weight="700">Draft або ChangesRequested</text><text x="266" y="352" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Збережено Article + ArticleRevision у PostgreSQL</text><text x="266" y="387" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Автор може редагувати лише свою актуальну версію</text><rect x="250" y="510" width="700" height="140" rx="8" fill="#f6f8f6" stroke="#34443e" stroke-width="2"/><path d="M250 562H950" stroke="#34443e"/><text x="266" y="545" font-family="Arial" font-size="26" fill="#172823" text-anchor="start" font-weight="700">Надіслати на перевірку</text><text x="266" y="592" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Перевірка стану й Version → UnderReview</text><text x="266" y="627" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Запис Submitted, блокування авторських змін</text><rect x="250" y="750" width="700" height="140" rx="8" fill="#f6f8f6" stroke="#34443e" stroke-width="2"/><path d="M250 802H950" stroke="#34443e"/><text x="266" y="785" font-family="Arial" font-size="26" fill="#172823" text-anchor="start" font-weight="700">Редактор перевіряє текст і джерело</text><text x="266" y="832" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Роль Editor, поточний стан і Version</text><text x="266" y="867" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Рішення прив’язане до конкретної версії тексту</text><rect x="50" y="1030" width="500" height="140" rx="8" fill="#f6f8f6" stroke="#34443e" stroke-width="2"/><path d="M50 1082H550" stroke="#34443e"/><text x="66" y="1065" font-family="Arial" font-size="26" fill="#172823" text-anchor="start" font-weight="700">Повернення з коментарем</text><text x="66" y="1112" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Коментар 5–1000 символів</text><text x="66" y="1147" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">ChangesRequested + Returned</text><rect x="670" y="1030" width="500" height="140" rx="8" fill="#f6f8f6" stroke="#34443e" stroke-width="2"/><path d="M670 1082H1170" stroke="#34443e"/><text x="686" y="1065" font-family="Arial" font-size="26" fill="#172823" text-anchor="start" font-weight="700">Публікація</text><text x="686" y="1112" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Непорожні назва й текст</text><text x="686" y="1147" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Published + PublishedAtUtc</text><rect x="670" y="1300" width="500" height="140" rx="8" fill="#f6f8f6" stroke="#34443e" stroke-width="2"/><path d="M670 1352H1170" stroke="#34443e"/><text x="686" y="1335" font-family="Arial" font-size="26" fill="#172823" text-anchor="start" font-weight="700">Публічний каталог</text><text x="686" y="1382" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Лише статус Published</text><text x="686" y="1417" font-family="Arial" font-size="24" fill="#172823" text-anchor="start" font-weight="400">Пошук / рубрика / сторінка матеріалу</text><polyline points="600,170 600,270" fill="none" stroke="#34443e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="600,410 600,510" fill="none" stroke="#34443e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="600,650 600,750" fill="none" stroke="#34443e" stroke-width="2" marker-end="url(#arrow)"/><polyline points="440,890 440,940 300,940 300,1030" fill="none" stroke="#34443e" stroke-width="2" marker-end="url(#arrow)"/><rect x="276" y="957" width="168" height="30" fill="white"/><text x="280" y="980" font-family="Arial" font-size="22" fill="#172823" text-anchor="start" font-weight="400">Потрібні зміни</text><polyline points="780,890 780,940 900,940 900,1030" fill="none" stroke="#34443e" stroke-width="2" marker-end="url(#arrow)"/><rect x="916" y="957" width="96" height="30" fill="white"/><text x="920" y="980" font-family="Arial" font-size="22" fill="#172823" text-anchor="start" font-weight="400">Схвалено</text><polyline points="50,1110 15,1110 15,350 250,350" fill="none" stroke="#34443e" stroke-width="2" marker-end="url(#arrow)"/><rect x="21" y="677" width="132" height="30" fill="white"/><text x="25" y="700" font-family="Arial" font-size="22" fill="#172823" text-anchor="start" font-weight="400">Виправлення</text><polyline points="920,1170 920,1300" fill="none" stroke="#34443e" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="1550" font-family="Arial" font-size="23" fill="#172823" text-anchor="start" font-weight="400">Невірні поля → 400 · Чужий матеріал → 404 · Конфлікт версії/стану → 409</text></svg>